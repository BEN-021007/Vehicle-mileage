<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>车型销量及行驶里程分布情况</title>
<style>
  :root {
    --bg: #f4f6fa;
    --card: #ffffff;
    --primary: #2f6fed;
    --primary-dark: #1f52c0;
    --text: #1f2937;
    --muted: #6b7280;
    --border: #e5e7eb;
    --head: #4472c4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px;
    background: var(--bg); color: var(--text);
    font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", Arial, sans-serif;
    font-size: 14px;
  }
  .wrap { max-width: 1280px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 18px; word-break: break-all; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 18px; margin-bottom: 18px; box-shadow: 0 1px 3px rgba(0,0,0,.04);
  }
  .toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  button {
    border: none; border-radius: 6px; padding: 9px 18px; font-size: 14px;
    cursor: pointer; font-family: inherit; transition: .15s;
  }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover:not(:disabled) { background: var(--primary-dark); }
  .btn-ghost { background: #fff; color: var(--text); border: 1px solid var(--border); }
  .btn-ghost:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  select, input[type=text] {
    padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px;
    font-size: 14px; font-family: inherit; outline: none; background: #fff;
  }
  input[type=text] { min-width: 240px; }
  select:focus, input:focus { border-color: var(--primary); }
  .spacer { flex: 1; }
  .progress-wrap { margin-top: 14px; display: none; }
  .progress-wrap.show { display: block; }
  .bar { height: 8px; background: #eef1f7; border-radius: 4px; overflow: hidden; }
  .bar > i {
    display: block; height: 100%; width: 0; border-radius: 4px;
    background: linear-gradient(90deg, #2f6fed, #56a0ff); transition: width .3s;
  }
  .msg { margin-top: 8px; font-size: 13px; color: var(--muted); }
  .msg.error { color: #d93025; }
  .stats { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 14px; }
  .stat {
    flex: 1 1 150px; background: #f8fafc; border: 1px solid var(--border);
    border-radius: 8px; padding: 12px 14px;
  }
  .stat .k { color: var(--muted); font-size: 12px; }
  .stat .v { font-size: 20px; font-weight: 600; margin-top: 4px; }
  table { border-collapse: collapse; width: 100%; min-width: 1120px; }
  th, td { padding: 10px 12px; border-bottom: 1px solid var(--border); }
  thead th {
    background: var(--head); color: #fff; font-weight: 600; text-align: center;
    position: sticky; top: 0; z-index: 2; cursor: pointer; user-select: none; white-space: nowrap;
  }
  thead th:first-child { text-align: left; }
  th .arrow { font-size: 11px; opacity: .8; }
  tbody td { text-align: center; }
  tbody td:first-child { text-align: left; font-weight: 500; }
  tbody tr:nth-child(even) { background: #fafbfe; }
  tbody tr:hover { background: #eef4ff; }
  tfoot td { text-align: center; font-weight: 700; background: #f1f5f9; border-top: 2px solid var(--border); }
  tfoot td:first-child { text-align: left; }
  .table-box { max-height: 68vh; overflow: auto; border: 1px solid var(--border); border-radius: 8px; }
  .empty { padding: 40px; text-align: center; color: var(--muted); }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; background: #e8f0ff; color: var(--primary); }
  .limit { margin-top: 10px; font-size: 13px; color: #b45309; min-height: 18px; }
  .mask {
    position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 50;
    display: none; align-items: center; justify-content: center;
  }
  .mask.show { display: flex; }
  .modal {
    background: #fff; border-radius: 10px; width: 420px; max-width: 90%;
    padding: 20px 22px; box-shadow: 0 8px 30px rgba(0,0,0,.18);
  }
  .modal-title { font-size: 16px; font-weight: 600; margin-bottom: 10px; }
  .modal-body { font-size: 14px; line-height: 1.8; color: #374151; }
  .modal-foot { text-align: right; margin-top: 18px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>车型销量及行驶里程分布情况</h1>
  <div class="sub">按「内部车辆型号」统计车辆累计里程分布（数据来源：新能源车辆接口 + 燃油车辆接口）</div>

  <div class="card">
    <div class="toolbar">
      <button class="btn-primary" id="btnRun">开始统计</button>
      <button class="btn-ghost" id="btnExport" disabled>导出 Excel</button>
      <label>数据来源
        <select id="source">
          <option value="all">全部（新能源+燃油）</option>
          <option value="new">新能源车辆</option>
          <option value="fuel">燃油车辆</option>
        </select>
      </label>
      <label>统计口径
        <select id="scope">
          <option value="sold">仅已销售车辆</option>
          <option value="all">其他车辆</option>
        </select>
      </label>
      <div class="spacer"></div>
      <input type="text" id="kw" placeholder="搜索内部车辆型号（支持多个，逗号分隔）">
    </div>

    <div class="limit" id="limitTip"></div>

    <div class="progress-wrap" id="progWrap">
      <div class="bar"><i id="bar"></i></div>
      <div class="msg" id="msg"></div>
    </div>

    <div class="stats" id="stats" style="display:none">
      <div class="stat"><div class="k">内部车辆型号数</div><div class="v" id="sModels">-</div></div>
      <div class="stat"><div class="k">计入统计车辆数</div><div class="v" id="sTotal">-</div></div>
      <div class="stat"><div class="k">导出数据总行数</div><div class="v" id="sRows">-</div></div>
      <div class="stat"><div class="k" id="sSoldLabel">其中实销车辆数</div><div class="v" id="sSold">-</div></div>
      <div class="stat"><div class="k">生成时间</div><div class="v" id="sTime" style="font-size:15px">-</div></div>
    </div>
  </div>

  <div class="card">
    <div class="table-box">
      <table id="tbl">
        <thead>
          <tr id="headRow">
            <th data-key="model">内部车辆型号 <span class="arrow"></span></th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
        <tfoot id="tfoot"></tfoot>
      </table>
      <div class="empty" id="empty">点击「开始统计」后，将自动拉取接口数据并生成分布表</div>
    </div>
  </div>
</div>

<div class="mask" id="mask">
  <div class="modal">
    <div class="modal-title">提示</div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot"><button class="btn-primary" id="modalOk">确定</button></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let rawItems = [];
let lastState = null;
let sortKey = 'total', sortAsc = false;
let polling = null;

const fmt = n => (n || 0).toLocaleString('zh-CN');

/* 里程区间（与服务端 BUCKETS 保持一致） */
const BUCKETS = [
  { key: 'b1', label: '≤3000km' },
  { key: 'b2', label: '3000-10000km' },
  { key: 'b3', label: '10000-20000km' },
  { key: 'b4', label: '20000-30000km' },
  { key: 'b5', label: '30000-50000km' },
  { key: 'b6', label: '50000-80000km' },
  { key: 'b7', label: '80000-100000km' },
  { key: 'b8', label: '100000-150000km' },
  { key: 'b9', label: '150000-200000km' },
  { key: 'b10', label: '≥200000km' }
];
const BKEYS = BUCKETS.map(b => b.key);
const bucketTotal = d => BKEYS.reduce((s, k) => s + (d[k] || 0), 0);

function currentScope() { return $('scope').value; }
function currentSource() { return $('source').value; }
function resultOf(st, src) { return (st && st.results) ? (st.results[src] || null) : null; }
function sourceName() {
  const o = $('source').selectedOptions[0];
  return o ? o.textContent : '';
}

function flatten(items, scope) {
  const key = scope === 'all' ? 'all' : 'sold';
  return items.map(it => {
    const d = it[key];
    const row = { model: it.model, rawTotal: d.total, noMileage: d.noMileage };
    for (const k of BKEYS) row[k] = d[k] || 0;
    row.total = bucketTotal(d);
    return row;
  });
}

function visibleRows() {
  const kw = $('kw').value.trim();
  let rows = flatten(rawItems, currentScope());
  if (kw) {
    const keys = kw.split(/[,，\s]+/).filter(Boolean).map(s => s.toUpperCase());
    rows = rows.filter(r => keys.some(k => r.model.toUpperCase().includes(k)));
  }
  rows.sort((a, b) => {
    let x = a[sortKey], y = b[sortKey];
    if (typeof x === 'string') { x = x.toLowerCase(); y = y.toLowerCase(); }
    const r = x < y ? -1 : (x > y ? 1 : 0);
    return sortAsc ? r : -r;
  });
  return rows;
}

function render() {
  const tb = $('tbody'), tf = $('tfoot');
  if (!rawItems.length) {
    tb.innerHTML = ''; tf.innerHTML = '';
    const e = $('empty');
    e.style.display = 'block';
    e.textContent = window.__busy
      ? '正在拉取【' + sourceName() + '】接口数据，接口生成导出文件约需 1~2 分钟，请耐心等待...'
      : '点击「开始统计」后，将自动拉取【' + sourceName() + '】接口数据并生成分布表';
    $('btnExport').textContent = '导出 Excel';
    return;
  }
  $('empty').style.display = 'none';
  const rows = visibleRows();
  $('btnExport').textContent = $('kw').value.trim() ? `导出筛选结果（${rows.length} 款）` : '导出 Excel';
  tb.innerHTML = rows.map(r => `<tr>
    <td>${r.model}</td>
    ${BKEYS.map(k => `<td>${fmt(r[k])}</td>`).join('')}
    <td>${fmt(r.total)}</td>
  </tr>`).join('');

  const sum = k => rows.reduce((s, r) => s + r[k], 0);
  const noMileage = rows.reduce((s, r) => s + (r.rawTotal - r.total), 0);
  tf.innerHTML = `<tr>
    <td>合计（${rows.length} 个型号）</td>
    ${BKEYS.map(k => `<td>${fmt(sum(k))}</td>`).join('')}
    <td>${fmt(sum('total'))}${noMileage ? `<div style="font-weight:400;font-size:12px;color:#6b7280">另有 ${fmt(noMileage)} 辆无里程数据</div>` : ''}</td>
  </tr>`;

  document.querySelectorAll('thead th').forEach(th => {
    const a = th.querySelector('.arrow');
    a.textContent = th.dataset.key === sortKey ? (sortAsc ? ' ▲' : ' ▼') : '';
  });
}

function setStats(res) {
  const rows = flatten(res.items, currentScope());
  const total = rows.reduce((s, r) => s + r.total, 0);
  $('sModels').textContent = fmt(rows.filter(r => r.total > 0).length);
  $('sTotal').textContent = fmt(total);
  $('sRows').textContent = fmt(res.summary.rows);
  $('sSold').textContent = fmt(res.summary.soldRows);
  $('sSoldLabel').textContent = res.soldLabel || '其中实销车辆数';
  $('sTime').textContent = res.generatedAt || '-';
  $('stats').style.display = 'flex';
}

function onState(st) {
  lastState = st;
  $('progWrap').classList.add('show');
  $('bar').style.width = (st.progress || 0) + '%';
  const m = $('msg');
  m.className = 'msg' + (st.status === 'error' ? ' error' : '');
  if (st.status === 'error') {
    m.innerHTML = '✗ ' + (st.error || '统计失败');
  } else if (st.status === 'done') {
    m.innerHTML = '✓ 统计完成（' + (st.finishedAt || '') + '）'
      + (st.downloadUrl ? ' <span class="tag">已获取导出文件</span>' : '');
  } else if (st.status === 'running') {
    m.innerHTML = '⏳ [' + (st.apiName || '') + '] ' + (st.message || '处理中...');
  } else {
    m.textContent = st.message || '';
  }

  const running = st.status === 'running';
  window.__busy = running;
  $('btnRun').disabled = running;
  $('btnRun').textContent = running ? '统计中...' : (resultOf(st, currentSource()) ? '重新统计' : '开始统计');

  const res = resultOf(st, currentSource());
  if (res) {
    rawItems = res.items;
    $('btnExport').disabled = false;
    setStats(res);
    render();
  } else {
    rawItems = [];
    $('btnExport').disabled = true;
    $('stats').style.display = 'none';
    render();
  }

  if (running) poll();
  if (st.status !== 'running' && polling) { clearInterval(polling); polling = null; }
  updateLimitTip();
}

async function poll() {
  if (polling) return;
  polling = setInterval(async () => {
    try {
      const r = await fetch('/api/status?_=' + Date.now());
      onState(await r.json());
    } catch (e) { /* ignore */ }
  }, 2000);
}

function showModal(html) {
  $('modalBody').innerHTML = html;
  $('mask').classList.add('show');
}
function hideModal() { $('mask').classList.remove('show'); }

const pad = n => String(n).padStart(2, '0');
function remainText(ms) {
  const h = Math.floor(ms / 3600000), m = Math.floor(ms % 3600000 / 60000), s = Math.floor(ms % 60000 / 1000);
  return pad(h) + ':' + pad(m) + ':' + pad(s);
}

function updateLimitTip() {
  const src = currentSource();
  const lr = (lastState && lastState.lastRuns) ? lastState.lastRuns[src] : null;
  const tip = $('limitTip');
  if (!lr) { tip.textContent = ''; return; }
  const remain = new Date(lr.replace(' ', 'T')).getTime() + 24 * 3600 * 1000 - Date.now();
  tip.textContent = remain > 0
    ? '【' + sourceName() + '】上次统计时间 ' + lr + '，距下次可统计还有 ' + remainText(remain)
    : '';
}

async function start() {
  const src = currentSource();
  const res = await (await fetch('/api/refresh?source=' + src)).json();
  if (res.started) {
    rawItems = [];
    window.__busy = true;
    $('btnExport').disabled = true;
    $('stats').style.display = 'none';
    render();
    const r = await fetch('/api/status?_=' + Date.now());
    onState(await r.json());
    return;
  }
  if (res.cooldown && res.cooldown.limited) {
    const c = res.cooldown;
    showModal('【' + sourceName() + '】在 24 小时内只能统计一次。<br>'
      + '上次统计时间：<b>' + c.lastRunAt + '</b><br>'
      + '下次可统计时间：<b>' + c.nextRunAt + '</b><br>'
      + '剩余时间：<b>' + remainText(c.remainSeconds * 1000) + '</b>');
  } else if (res.running) {
    showModal('已有统计任务正在执行中，请等待当前任务完成后再试。');
  } else {
    showModal('未能启动统计任务，请稍后重试。');
  }
}

$('btnRun').onclick = start;
$('btnExport').onclick = () => {
  const rows = visibleRows();
  if (!rows.length) { showModal('没有可导出的车型，请确认查询框中的条件能匹配到车型。'); return; }
  const kw = $('kw').value.trim();
  location.href = '/api/download?source=' + encodeURIComponent(currentSource())
    + '&scope=' + encodeURIComponent(currentScope())
    + '&kw=' + encodeURIComponent(kw);
};
$('modalOk').onclick = hideModal;
$('mask').onclick = e => { if (e.target === $('mask')) hideModal(); };
$('scope').onchange = () => {
  if (lastState) onState(lastState);
};
$('source').onchange = () => {
  if (lastState) onState(lastState);
  else render();
  updateLimitTip();
};
setInterval(updateLimitTip, 1000);
$('kw').oninput = render;

/* 表头按 BUCKETS 动态生成 */
$('headRow').innerHTML = '<th data-key="model">内部车辆型号 <span class="arrow"></span></th>'
  + BUCKETS.map(b => '<th data-key="' + b.key + '">' + b.label + ' <span class="arrow"></span></th>').join('')
  + '<th data-key="total">实销总数 <span class="arrow"></span></th>';

document.querySelectorAll('thead th').forEach(th => {
  th.onclick = () => {
    const k = th.dataset.key;
    if (sortKey === k) sortAsc = !sortAsc;
    else { sortKey = k; sortAsc = (k === 'model'); }
    render();
  };
});

(async function init() {
  try {
    const r = await fetch('/api/status?_=' + Date.now());
    onState(await r.json());
  } catch (e) { /* ignore */ }
})();
</script>
</body>
</html>
